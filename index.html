<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Ricochet - Arcade Puzzle Shooter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Fredoka', 'Nunito', sans-serif;
            touch-action: none;
        }

        /* Cup Pong Reference Style UI Pill Buttons */
        .cup-pill {
            background: #ffffff;
            border: 3.5px solid #111827;
            box-shadow: 0 4px 0 #111827;
            border-radius: 9999px;
            color: #111827;
            font-weight: 800;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.15s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .cup-pill:hover {
            background: #f8fafc;
        }

        .cup-pill:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #111827;
        }

        .cup-pill-green {
            background: #84cc16;
            color: #ffffff;
            text-shadow: 0 2px 0 #111827;
        }
        .cup-pill-green:hover {
            background: #65a30d;
        }

        .cup-pill-amber {
            background: #f59e0b;
            color: #ffffff;
            text-shadow: 0 2px 0 #111827;
        }
        .cup-pill-amber:hover {
            background: #d97706;
        }

        /* Chunky Outlined Display Typography matching "Cup Pong" title */
        .chunky-title {
            color: #ffffff;
            -webkit-text-stroke: 7px #111827;
            paint-order: stroke fill;
            text-shadow: 0 6px 0 #111827;
            letter-spacing: 0.02em;
        }

        .chunky-subtitle {
            color: #ffffff;
            -webkit-text-stroke: 4px #111827;
            paint-order: stroke fill;
            text-shadow: 0 3px 0 #111827;
        }

        .chunky-score {
            color: #ffffff;
            -webkit-text-stroke: 6px #111827;
            paint-order: stroke fill;
            text-shadow: 0 5px 0 #111827;
        }

        /* Modal Card styling */
        .arcade-card {
            background: #ffffff;
            border: 5px solid #111827;
            box-shadow: 0 10px 0 #111827;
            border-radius: 28px;
        }

        /* Portrait Warning Overlay for small phones held vertically */
        #portrait-hint {
            display: none;
        }
        @media screen and (max-width: 640px) and (orientation: portrait) {
            #portrait-hint {
                display: flex;
            }
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative select-none overflow-hidden">

    <!-- Responsive Game Wrapper -->
    <div id="game-wrapper" class="relative w-full h-full flex items-center justify-center bg-[#0f172a]">
        
        <!-- Main 16:9 Scaled Container -->
        <div id="stage-container" class="relative overflow-hidden shadow-2xl" style="width: 1280px; height: 720px;">
            
            <!-- Game Canvas -->
            <canvas id="gameCanvas" width="1280" height="720" class="block w-full h-full cursor-crosshair"></canvas>

            <!-- SLIM TOP HUD BAR (Tucked strictly inside the 45px top border wall so 100% of the arena is unobstructed!) -->
            <div class="absolute top-0 left-0 right-0 h-[36px] sm:h-[42px] px-2 sm:px-4 flex items-center justify-between pointer-events-none z-10">
                <!-- Left: Level Badge, Score & Compact Ammo -->
                <div class="flex items-center gap-1 sm:gap-2 pointer-events-none">
                    <div class="cup-pill px-2 py-0.5 text-[10px] sm:text-xs pointer-events-none">
                        <span class="text-[#65a30d] font-black" id="hud-level-badge">LVL 1/50</span>
                        <span class="text-gray-400 font-black hidden sm:inline">-</span>
                        <span class="text-[#0284c7] font-black hidden sm:inline" id="hud-stars-badge">★★★</span>
                    </div>

                    <div class="cup-pill px-2 py-0.5 flex items-center gap-1 pointer-events-none" title="Remaining Ricochet Shells">
                        <div id="ammo-container" class="flex items-center gap-0.5 h-3.5 sm:h-4">
                            <!-- Shells injected via JS -->
                        </div>
                    </div>

                    <button id="btn-super-shot" class="cup-pill px-2 py-0.5 text-[10px] sm:text-xs flex items-center gap-0.5 border-[#111827] bg-[#fef08a] pointer-events-auto" title="Toggle Super Explosive Bouncer">
                        <span>💣</span>
                        <span id="super-count-text" class="font-black">x1</span>
                    </button>

                    <div class="px-1.5 flex items-center pointer-events-none">
                        <span id="hud-score" class="chunky-subtitle text-sm sm:text-lg font-black tracking-wider">0</span>
                    </div>
                </div>

                <!-- Center: Compact Title (Desktop Only, pointer-events-none) -->
                <div class="hidden xl:flex items-center gap-2 pointer-events-none">
                    <span class="chunky-subtitle text-base font-black tracking-tight">Zombie Pong</span>
                    <span id="hud-chapter-subtitle" class="text-[10px] font-black uppercase tracking-wider bg-slate-900/90 text-lime-300 px-2 py-0.5 rounded-full">
                        Chapter 1
                    </span>
                </div>

                <!-- Right: Compact Action Pills inside top border -->
                <div class="flex items-center gap-1 sm:gap-1.5 pointer-events-auto">
                    <button id="btn-hint" class="cup-pill px-2 py-0.5 text-[10px] sm:text-xs bg-amber-200" title="Show Optimal Trick-Shot Angle (H)">
                        <span>💡</span><span class="hidden md:inline">Hint</span>
                    </button>
                    <button id="btn-levels" class="cup-pill px-2 py-0.5 text-[10px] sm:text-xs" title="Select Level">
                        <span>📋</span><span class="hidden md:inline">Levels</span>
                    </button>
                    <button id="btn-skip" class="cup-pill px-2 py-0.5 text-[10px] sm:text-xs" title="Skip to Next Level">
                        <span>⏭</span><span class="hidden md:inline">Skip</span>
                    </button>
                    <button id="btn-restart" class="cup-pill px-2 py-0.5 text-[10px] sm:text-xs" title="Restart Level (R)">
                        <span>🔄</span>
                    </button>
                    <button id="btn-sound" class="cup-pill px-2 py-0.5 text-[10px] sm:text-xs" title="Toggle Sound">
                        <span id="sound-icon">🔊</span>
                    </button>
                    <button id="btn-pause" class="cup-pill px-2 py-0.5 text-[10px] sm:text-xs" title="Pause / Menu">
                        <span>⏸</span>
                    </button>
                </div>
            </div>

            <!-- Portrait Orientation Helpful Floating Banner (Dismissible) -->
            <div id="portrait-hint" class="absolute top-12 left-1/2 -translate-x-1/2 z-30 pointer-events-auto">
                <div class="cup-pill px-3 py-1 text-[11px] bg-amber-300 text-slate-900 flex items-center gap-2 shadow-lg">
                    <span>📱 Rotate phone to <b>Landscape</b> for best view!</span>
                    <button onclick="document.getElementById('portrait-hint').style.display='none'" class="font-black underline ml-1">OK</button>
                </div>
            </div>

            <!-- LEVEL COMPLETE / GAME OVER / LEVEL SELECT MODAL -->
            <div id="modal-overlay" class="absolute inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center z-40 hidden">
                <div class="arcade-card w-[90%] max-w-[520px] p-6 md:p-8 text-center relative animate-bounce-short">
                    
                    <!-- Modal Header Title -->
                    <h2 id="modal-title" class="chunky-title text-3xl md:text-5xl font-black mb-2">
                        STAGE CLEAR!
                    </h2>
                    <p id="modal-subtitle" class="text-slate-600 font-extrabold text-sm md:text-base mb-5">
                        All zombies eliminated with ricochet precision!
                    </p>

                    <!-- Dynamic Body (Stats or Level Grid) -->
                    <div id="modal-stats-box" class="bg-[#f1f5f9] border-4 border-[#111827] rounded-2xl p-4 mb-6 flex justify-around items-center">
                        <div>
                            <div class="text-xs font-extrabold uppercase text-slate-500">Level Score</div>
                            <div id="modal-score" class="text-2xl md:text-3xl font-black text-[#111827]">4,500</div>
                        </div>
                        <div class="h-10 w-1 bg-slate-300 rounded-full"></div>
                        <div>
                            <div class="text-xs font-extrabold uppercase text-slate-500">Ammo Bonus</div>
                            <div id="modal-bonus" class="text-2xl md:text-3xl font-black text-[#65a30d]">+2,000</div>
                        </div>
                        <div class="h-10 w-1 bg-slate-300 rounded-full"></div>
                        <div>
                            <div class="text-xs font-extrabold uppercase text-slate-500">Rating</div>
                            <div id="modal-stars" class="text-2xl md:text-3xl font-black text-amber-500">★★★</div>
                        </div>
                    </div>

                    <!-- Chapter Tabs for 50-Level Select (Hidden unless in Level Select mode) -->
                    <div id="modal-chapter-tabs" class="flex flex-wrap justify-center gap-1.5 mb-3 hidden">
                        <button data-page="0" class="chapter-tab cup-pill px-3 py-1 text-xs">1–10: Basics</button>
                        <button data-page="1" class="chapter-tab cup-pill px-3 py-1 text-xs">11–20: Moving</button>
                        <button data-page="2" class="chapter-tab cup-pill px-3 py-1 text-xs">21–30: Switches</button>
                        <button data-page="3" class="chapter-tab cup-pill px-3 py-1 text-xs">31–40: Portals</button>
                        <button data-page="4" class="chapter-tab cup-pill px-3 py-1 text-xs">41–50: Finale</button>
                    </div>

                    <!-- Level Select Grid (Hidden unless in Level Select mode) -->
                    <div id="modal-level-grid" class="grid grid-cols-5 gap-2 mb-5 max-h-[240px] overflow-y-auto p-1 hidden">
                        <!-- Level buttons injected by JS -->
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex flex-wrap items-center justify-center gap-3">
                        <button id="modal-btn-retry" class="cup-pill px-6 py-2.5 text-base uppercase">
                            🔄 Replay
                        </button>
                        <button id="modal-btn-levels" class="cup-pill px-6 py-2.5 text-base uppercase">
                            📋 All 50 Levels
                        </button>
                        <button id="modal-btn-next" class="cup-pill cup-pill-green px-7 py-2.5 text-base uppercase">
                            Next Level ▶
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * ZOMBIE PONG RICOCHET - 50-LEVEL EDITION
         * Combines "Stupid Zombies" ricochet physics, switches, portals, moving platforms,
         * spinning windmills, and pinball bumpers with the "Cup Pong" vector style.
         * ============================================================================
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const stageContainer = document.getElementById('stage-container');

        const GAME_W = 1280;
        const GAME_H = 720;
        const OUTLINE_COLOR = '#111827'; // Thick dark navy/black outline from Ref 4

        // ============================================================================
        // WEB AUDIO SYNTHESIZER (Zero external dependencies, crisp arcade SFX)
        // ============================================================================
        class SoundEngine {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playShoot(isSuper = false) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = isSuper ? 'sawtooth' : 'triangle';
                osc.frequency.setValueAtTime(isSuper ? 220 : 360, now);
                osc.frequency.exponentialRampToValueAtTime(55, now + 0.18);

                gain.gain.setValueAtTime(0.32, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.19);
            }

            playRicochet(bounceNum = 1) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const baseFreq = 520 + Math.min(bounceNum * 85, 800);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(baseFreq, now);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.35, now + 0.08);

                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.09);
            }

            playSwitch() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(580, now);
                osc.frequency.setValueAtTime(880, now + 0.07);
                gain.gain.setValueAtTime(0.28, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.22);
            }

            playPortal() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(980, now + 0.16);
                gain.gain.setValueAtTime(0.26, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.17);
            }

            playZombieHit(combo = 1) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const pitch = 280 + Math.min(combo * 70, 500);
                osc.type = 'square';
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.exponentialRampToValueAtTime(pitch * 1.6, now + 0.12);

                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.13);
            }

            playExplosion() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const bufferSize = this.ctx.sampleRate * 0.35;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(420, now);
                filter.frequency.linearRampToValueAtTime(60, now + 0.35);

                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.45, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
            }

            playWin() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((freq, idx) => {
                    const now = this.ctx.currentTime + idx * 0.09;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                });
            }
        }

        const sfx = new SoundEngine();

        // ============================================================================
        // RESPONSIVE 16:9 SCALING FOR PHONE & LAPTOP
        // ============================================================================
        let canvasScale = 1;
        function resizeStage() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const targetRatio = GAME_W / GAME_H;
            const currentRatio = vw / vh;

            let drawW, drawH;
            if (currentRatio > targetRatio) {
                drawH = vh;
                drawW = vh * targetRatio;
            } else {
                drawW = vw;
                drawH = vw / targetRatio;
            }

            stageContainer.style.width = `${drawW}px`;
            stageContainer.style.height = `${drawH}px`;
            canvasScale = drawW / GAME_W;
        }
        window.addEventListener('resize', resizeStage);
        resizeStage();

        // ============================================================================
        // GEOMETRY & VECTOR MATH HELPERS FOR RICOCHET & RAYCASTING
        // ============================================================================
        function intersectRaySegment(rx, ry, dx, dy, x1, y1, x2, y2) {
            const vx = x2 - x1;
            const vy = y2 - y1;
            const denom = dx * vy - dy * vx;
            if (Math.abs(denom) < 1e-7) return null;

            const qpx = x1 - rx;
            const qpy = y1 - ry;
            const t = (qpx * vy - qpy * vx) / denom;
            const u = (qpx * dy - qpy * dx) / denom;

            if (t >= 0.001 && u >= 0 && u <= 1) {
                const segLen = Math.hypot(vx, vy) || 1;
                let nx = -vy / segLen;
                let ny = vx / segLen;
                if (nx * dx + ny * dy > 0) {
                    nx = -nx;
                    ny = -ny;
                }
                return {
                    t,
                    x: rx + t * dx,
                    y: ry + t * dy,
                    nx,
                    ny
                };
            }
            return null;
        }

        function buildSegmentsFromObstacle(obs) {
            const segs = [];
            if (obs.open) return segs; // Open gates don't block bullets!

            if (obs.type === 'rect' || obs.type === 'bumper' || obs.type === 'crate' || obs.type === 'gate') {
                const { x, y, w, h } = obs;
                segs.push({ x1: x, y1: y, x2: x + w, y2: y, obs });
                segs.push({ x1: x + w, y1: y, x2: x + w, y2: y + h, obs });
                segs.push({ x1: x + w, y1: y + h, x2: x, y2: y + h, obs });
                segs.push({ x1: x, y1: y + h, x2: x, y2: y, obs });
            } else if (obs.type === 'poly') {
                const pts = obs.points;
                for (let i = 0; i < pts.length; i++) {
                    const p1 = pts[i];
                    const p2 = pts[(i + 1) % pts.length];
                    segs.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, obs });
                }
            } else if (obs.type === 'spinner') {
                // Rotating Windmill Blade (2 perpendicular arms or 1 long paddle)
                const arms = obs.arms || 2;
                for (let a = 0; a < arms; a++) {
                    const ang = (obs.angle || 0) + (a * Math.PI) / arms;
                    const cos = Math.cos(ang);
                    const sin = Math.sin(ang);
                    const hw = obs.len / 2;
                    const ht = (obs.thick || 18) / 2;

                    const corners = [
                        { x: obs.cx - cos * hw + sin * ht, y: obs.cy - sin * hw - cos * ht },
                        { x: obs.cx + cos * hw + sin * ht, y: obs.cy + sin * hw - cos * ht },
                        { x: obs.cx + cos * hw - sin * ht, y: obs.cy + sin * hw + cos * ht },
                        { x: obs.cx - cos * hw - sin * ht, y: obs.cy - sin * hw + cos * ht }
                    ];
                    for (let i = 0; i < 4; i++) {
                        const p1 = corners[i];
                        const p2 = corners[(i + 1) % 4];
                        segs.push({ x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y, obs });
                    }
                }
            }
            return segs;
        }

        // ============================================================================
        // 50 CREATIVE, GUARANTEED-SOLVABLE PUZZLE LEVELS
        // Organized into 5 Themed 10-Level Chapters with Open Trick-Shot Corridors!
        // ============================================================================
        function create50Levels() {
            const list = [];

            // Helper to create 45-degree corner bounce wedges
            const wedgeTL = (x, y, s = 110) => ({
                type: 'poly', style: 'slope',
                points: [{ x, y }, { x: x + s, y }, { x, y: y + s }]
            });
            const wedgeTR = (x, y, s = 110) => ({
                type: 'poly', style: 'slope',
                points: [{ x: x - s, y }, { x, y }, { x, y: y + s }]
            });
            const wedgeBR = (x, y, s = 110) => ({
                type: 'poly', style: 'slope',
                points: [{ x: x - s, y }, { x, y: y - s }, { x, y }]
            });
            const wedgeBL = (x, y, s = 110) => ({
                type: 'poly', style: 'slope',
                points: [{ x, y: y - s }, { x: x + s, y }, { x, y }]
            });

            // ------------------------------------------------------------------------
            // LEVEL 1: Classic Staircase Ricochet (Ref 1)
            // ------------------------------------------------------------------------
            list.push({
                id: 1,
                chapter: "Chapter 1: Ricochet & Barrels",
                name: "Staircase Ricochet",
                subtitle: "Bank shots off the right wall & ceiling to sweep the tiered steps!",
                hintAngle: -0.18,
                ammo: 5, superAmmo: 1,
                hero: { x: 118, y: 430 },
                obstacles: [
                    { type: 'rect', x: 40, y: 430, w: 125, h: 26, style: 'platform' },
                    { type: 'rect', x: 130, y: 456, w: 35, h: 194, style: 'wall' },
                    { type: 'rect', x: 1110, y: 430, w: 130, h: 26, style: 'platform' },
                    { type: 'rect', x: 1110, y: 456, w: 35, h: 194, style: 'wall' },
                    { type: 'rect', x: 380, y: 540, w: 280, h: 24, style: 'platform' },
                    { type: 'rect', x: 620, y: 460, w: 280, h: 24, style: 'platform' },
                    { type: 'rect', x: 460, y: 365, w: 200, h: 24, style: 'platform' },
                    { type: 'rect', x: 620, y: 285, w: 200, h: 24, style: 'platform' },
                    { type: 'rect', x: 540, y: 190, w: 160, h: 24, style: 'platform' },
                    wedgeTR(1240, 45, 110)
                ],

        const LEVELS = create50Levels();

        // ============================================================================

        let currentLevelIdx = 0;

        function rebuildDynamicSegments() {

                allSegments.push(...buildSegmentsFromObstacle(obs));
            });
        }

        // ============================================================================

        // ============================================================================
        // SHOOTING & 3-BOUNCE PREDICTIVE LASER TRAJECTORY
        // ============================================================================
        function getMuzzlePos() {
            const barrelLen = 46;
            return {
                x: hero.gunX + Math.cos(aimAngle) * barrelLen,
                y: hero.gunY + Math.sin(aimAngle) * barrelLen
            };
        }

        function fireShot() {
            if (gameState !== 'PLAYING') return;
            if (ammo <= 0 && !superArmed) {
                spawnFloatingText(hero.x + 40, hero.y - 80, 'OUT OF AMMO!', '#ef4444', 24);
                return;
            }

            const muzzle = getMuzzlePos();
            const speed = 19.0;
            const isSuper = superArmed && superAmmo > 0;

            if (isSuper) {
                superAmmo--;
                superArmed = false;
            } else {
                ammo--;
            }

            sfx.playShoot(isSuper);

            bullets.push({
                x: muzzle.x,
                y: muzzle.y,
                vx: Math.cos(aimAngle) * speed,
                vy: Math.sin(aimAngle) * speed,
                bounces: 0,
                maxBounces: isSuper ? 10 : 7,
                isSuper,
                combo: 0,
                portalCooldown: 0,
                hitZombies: new Set(),
                trail: [{ x: muzzle.x, y: muzzle.y }]
            });

            for (let i = 0; i < 10; i++) {
                const spread = aimAngle + (Math.random() - 0.5) * 0.6;
                const spd = 3 + Math.random() * 6;
                particles.push({
                    x: muzzle.x,
                    y: muzzle.y,
                    vx: Math.cos(spread) * spd,
                    vy: Math.sin(spread) * spd,
                    r: 4 + Math.random() * 5,
                    color: isSuper ? '#f43f5e' : '#facc15',
                    alpha: 1,
                    life: 18
                });
            }

            updateHUD();
        }

        // Enhanced 3-Bounce Predictive Trajectory so players can easily spot bank-shot corridors!
        function computePredictivePath(customAngle = null) {
            const ang = customAngle !== null ? customAngle : aimAngle;
            const barrelLen = 46;
            let rx = hero.gunX + Math.cos(ang) * barrelLen;
            let ry = hero.gunY + Math.sin(ang) * barrelLen;
            let dx = Math.cos(ang);
            let dy = Math.sin(ang);

            const points = [{ x: rx, y: ry }];
            const maxBouncesPreview = 3;

            for (let b = 0; b < maxBouncesPreview; b++) {
                let closest = null;
                for (const seg of allSegments) {
                    const hit = intersectRaySegment(rx, ry, dx, dy, seg.x1, seg.y1, seg.x2, seg.y2);
                    if (hit && (!closest || hit.t < closest.t)) {
                        closest = hit;
                    }
                }
                if (!closest) break;

                points.push({ x: closest.x, y: closest.y });

                const dot = dx * closest.nx + dy * closest.ny;
                dx = dx - 2 * dot * closest.nx;
                dy = dy - 2 * dot * closest.ny;
                rx = closest.x + closest.nx * 0.6;
                ry = closest.y + closest.ny * 0.6;
            }
            return points;
        }

        // ============================================================================
        // EXPLOSIONS, SWITCHES, PORTALS & SCORE POPUPS
        // ============================================================================
        function triggerSwitch(sw) {
            if (sw.triggered) return;
            sw.triggered = true;
            sfx.playSwitch();
            spawnFloatingText(sw.x, sw.y - 25, 'GATE UNLOCKED!', '#00e676', 24);

            obstacles.forEach(obs => {
                if (obs.type === 'gate' && obs.gateId === sw.gateId) {
                    obs.open = true;
                }
            });
            rebuildDynamicSegments();
        }

        function triggerExplosion(ex, ey, radius = 160) {
            sfx.playExplosion();

            const colors = ['#facc15', '#fb923c', '#ef4444', '#ffffff', '#a3e635'];
            for (let i = 0; i < 36; i++) {
                const ang = (Math.PI * 2 * i) / 36 + Math.random() * 0.2;
                const spd = 3 + Math.random() * 11;
                particles.push({
                    x: ex,
                    y: ey,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    r: 6 + Math.random() * 9,
                    color: colors[i % colors.length],
                    alpha: 1,
                    life: 32 + Math.floor(Math.random() * 15)
                });
            }

            zombies.forEach(z => {
                if (!z.alive) return;
                const zx = z.x;
                const zy = z.y - z.h / 2;
                const d = Math.hypot(zx - ex, zy - ey);
                if (d <= radius) {
                    eliminateZombie(z, 2000, 'BOOM +2000!', (zx - ex) * 0.12, -10);
                }
            });

            // Chain-react nearby TNT or push steel barrels!
            barrels.forEach(b => {
                if (!b.active) return;
                const d = Math.hypot(b.x - ex, b.y - ey);
                if (d < radius + 45 && d > 1) {
                    if (b.kind === 'explosive') {
                        b.active = false;
                        setTimeout(() => triggerExplosion(b.x, b.y, 160), 90);
                    } else {
                        b.rolling = true;
                        b.vx += ((b.x - ex) / d) * 11;
                        b.vy -= 5;
                    }
                }
            });

            // Also trigger nearby switches caught in blast
            switches.forEach(sw => {
                if (!sw.triggered && Math.hypot(sw.x - ex, sw.y - ey) <= radius) {
                    triggerSwitch(sw);
                }
            });
        }

        function eliminateZombie(z, pts, customText = null, knockVx = 5, knockVy = -8) {
            if (!z.alive) return;
            z.alive = false;
            z.ragdoll = true;
            z.vx = knockVx || (Math.random() > 0.5 ? 6 : -6);
            z.vy = knockVy;
            z.vRot = (Math.random() - 0.5) * 0.25;

            levelScore += pts;

            const popColors = ['#84cc16', '#a3e635', '#facc15', '#38bdf8', '#f43f5e'];
            for (let i = 0; i < 20; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 2 + Math.random() * 7.5;
                particles.push({
                    x: z.x,
                    y: z.y - 34,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd - 2,
                    r: 4 + Math.random() * 6,
                    color: popColors[i % popColors.length],
                    alpha: 1,
                    life: 28 + Math.random() * 12
                });
            }

            spawnFloatingText(z.x, z.y - 55, customText || `+${pts}`, '#a3e635', 28);
            updateHUD();
        }

        function spawnFloatingText(x, y, text, color = '#ffffff', size = 26) {
            floatingTexts.push({
                x,
                y,
                text,
                color,
                size,
                vy: -1.6,
                alpha: 1,
                life: 55
            });
        }

        // ============================================================================
        // PHYSICS UPDATE LOOP
        // ============================================================================
        let simTick = 0;
        function updatePhysics() {
            simTick += 0.025;
            if (showHintTimer > 0) showHintTimer--;

            // 0. Update Moving Platforms & Spinning Windmills
            let needsSegmentRebuild = false;
            obstacles.forEach(obs => {
                if (obs.moving) {
                    obs.x = obs.baseX + Math.sin(simTick * obs.speed + (obs.phase || 0)) * (obs.ampX || 0);
                    obs.y = obs.baseY + Math.sin(simTick * obs.speed + (obs.phase || 0)) * (obs.ampY || 0);
                    needsSegmentRebuild = true;
                } else if (obs.type === 'spinner') {
                    obs.angle = (obs.angle || 0) + (obs.vRot || 0.03);
                    needsSegmentRebuild = true;
                }
            });
            if (needsSegmentRebuild) {
                rebuildDynamicSegments();
            }

            pinballs.forEach(pb => {
                if (pb.pulse > 0) pb.pulse *= 0.85;
            });

            // 1. Update Bouncing Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                if (b.portalCooldown > 0) b.portalCooldown--;

                const subSteps = 3;
                let removed = false;

                for (let s = 0; s < subSteps; s++) {
                    const stepVx = b.vx / subSteps;
                    const stepVy = b.vy / subSteps;
                    const stepLen = Math.hypot(stepVx, stepVy);
                    const dx = stepVx / stepLen;
                    const dy = stepVy / stepLen;

                    let closestHit = null;
                    let hitSeg = null;
                    for (const seg of allSegments) {
                        const hit = intersectRaySegment(b.x, b.y, dx, dy, seg.x1, seg.y1, seg.x2, seg.y2);
                        if (hit && hit.t <= stepLen && (!closestHit || hit.t < closestHit.t)) {
                            closestHit = hit;
                            hitSeg = seg;
                        }
                    }

                    if (closestHit) {
                        b.x = closestHit.x + closestHit.nx * 1.4;
                        b.y = closestHit.y + closestHit.ny * 1.4;
                        b.trail.push({ x: b.x, y: b.y });

                        const dot = b.vx * closestHit.nx + b.vy * closestHit.ny;
                        b.vx = b.vx - 2 * dot * closestHit.nx;
                        b.vy = b.vy - 2 * dot * closestHit.ny;

                        b.bounces++;
                        sfx.playRicochet(b.bounces);

                        if (hitSeg && hitSeg.obs && (hitSeg.obs.style === 'bumper' || hitSeg.obs.type === 'spinner')) {
                            b.maxBounces = Math.min(b.maxBounces + 1, 12);
                            spawnFloatingText(b.x, b.y - 15, 'TURBO BOUNCE!', '#facc15', 20);
                        }

                        if (b.isSuper && b.bounces === 1) {
                            triggerExplosion(b.x, b.y, 140);
                        }

                        for (let p = 0; p < 5; p++) {
                            particles.push({
                                x: b.x,
                                y: b.y,
                                vx: (Math.random() - 0.5) * 6,
                                vy: (Math.random() - 0.5) * 6,
                                r: 3.5,
                                color: '#38bdf8',
                                alpha: 1,
                                life: 15
                            });
                        }

                        if (b.bounces > b.maxBounces) {
                            bullets.splice(i, 1);
                            removed = true;
                            break;
                        }
                    } else {
                        b.x += stepVx;
                        b.y += stepVy;
                    }

                    // Check Switches
                    switches.forEach(sw => {
                        if (!sw.triggered && Math.hypot(b.x - sw.x, b.y - sw.y) <= sw.r + 8) {
                            triggerSwitch(sw);
                        }
                    });

                    // Check Teleport Portals (Blue <-> Orange)
                    if (b.portalCooldown === 0) {
                        portals.forEach(pt => {
                            if (Math.hypot(b.x - pt.ax, b.y - pt.ay) <= pt.r) {
                                b.x = pt.bx;
                                b.y = pt.by;
                                b.portalCooldown = 14;
                                b.maxBounces = Math.min(b.maxBounces + 2, 12);
                                sfx.playPortal();
                                spawnFloatingText(pt.bx, pt.by - 25, 'WARP!', '#38bdf8', 22);
                            } else if (Math.hypot(b.x - pt.bx, b.y - pt.by) <= pt.r) {
                                b.x = pt.ax;
                                b.y = pt.ay;
                                b.portalCooldown = 14;
                                b.maxBounces = Math.min(b.maxBounces + 2, 12);
                                sfx.playPortal();
                                spawnFloatingText(pt.ax, pt.ay - 25, 'WARP!', '#fb923c', 22);
                            }
                        });
                    }

                    // Check Neon Pinball Bumpers
                    pinballs.forEach(pb => {
                        const dist = Math.hypot(b.x - pb.x, b.y - pb.y);
                        if (dist <= pb.r + 7) {
                            const nx = (b.x - pb.x) / (dist || 1);
                            const ny = (b.y - pb.y) / (dist || 1);
                            const spd = Math.hypot(b.vx, b.vy);
                            b.vx = nx * spd;
                            b.vy = ny * spd;
                            b.x = pb.x + nx * (pb.r + 9);
                            b.y = pb.y + ny * (pb.r + 9);
                            pb.pulse = 10;
                            b.maxBounces = Math.min(b.maxBounces + 2, 14);
                            levelScore += 250;
                            sfx.playRicochet(5);
                            spawnFloatingText(pb.x, pb.y - 28, 'BUMPER +250!', '#f43f5e', 20);
                        }
                    });

                    // Check Zombies
                    zombies.forEach(z => {
                        if (!z.alive || b.hitZombies.has(z.id)) return;
                        if (
                            b.x > z.x - z.w * 0.65 &&
                            b.x < z.x + z.w * 0.65 &&
                            b.y > z.y - z.h &&
                            b.y < z.y
                        ) {
                            b.hitZombies.add(z.id);
                            b.combo++;
                            sfx.playZombieHit(b.combo);
                            const pts = 1000 * b.combo + (b.bounces > 0 ? 500 : 0);
                            const label = b.combo > 1 ? `COMBO x${b.combo}! +${pts}` : `+${pts}`;
                            eliminateZombie(z, pts, label, b.vx * 0.35, -7);
                        }
                    });

                    // Check Barrels
                    barrels.forEach(barrel => {
                        if (!barrel.active) return;
                        const d = Math.hypot(b.x - barrel.x, b.y - barrel.y);
                        if (d < barrel.r + 8) {
                            if (barrel.kind === 'explosive') {
                                barrel.active = false;
                                triggerExplosion(barrel.x, barrel.y, 165);
                            } else {
                                barrel.rolling = true;
                                barrel.vx = b.vx >= 0 ? 7.0 : -7.0;
                                sfx.playRicochet(3);
                                spawnFloatingText(barrel.x, barrel.y - 35, 'CRUSHER ROLL!', '#38bdf8', 22);
                            }
                        }
                    });
                }

                if (!removed) {
                    b.trail.push({ x: b.x, y: b.y });
                    if (b.trail.length > 26) b.trail.shift();
                }
            }

            // 2. Update Rolling Barrels (Supports Portals, Ramps, Platforms & Crushing)
            barrels.forEach(barrel => {
                if (!barrel.active) return;
                if (barrel.portalCooldown > 0) barrel.portalCooldown--;

                if (barrel.rolling) {
                    barrel.vy += 0.45;
                    barrel.x += barrel.vx;
                    barrel.y += barrel.vy;
                    barrel.angle += barrel.vx * 0.04;

                    // Barrel Warp through Portals!
                    if (barrel.portalCooldown === 0) {
                        portals.forEach(pt => {
                            if (Math.hypot(barrel.x - pt.ax, barrel.y - pt.ay) <= pt.r + barrel.r * 0.5) {
                                barrel.x = pt.bx;
                                barrel.y = pt.by;
                                barrel.portalCooldown = 30;
                                sfx.playPortal();
                            }
                        });
                    }

                    if (barrel.x - barrel.r < ARENA.left) {
                        barrel.x = ARENA.left + barrel.r;
                        barrel.vx = Math.abs(barrel.vx) * 0.85;
                    } else if (barrel.x + barrel.r > ARENA.right) {
                        barrel.x = ARENA.right - barrel.r;
                        barrel.vx = -Math.abs(barrel.vx) * 0.85;
                    }

                    if (barrel.y + barrel.r > ARENA.bottom) {
                        barrel.y = ARENA.bottom - barrel.r;
                        barrel.vy = 0;
                        if (Math.abs(barrel.vx) < 1.5) barrel.vx = barrel.vx >= 0 ? 5.0 : -5.0;
                    }

                    obstacles.forEach(obs => {
                        if (obs.open) return;
                        if (obs.type === 'rect' || obs.type === 'crate' || obs.type === 'gate') {
                            if (
                                barrel.x > obs.x - barrel.r * 0.5 &&
                                barrel.x < obs.x + obs.w + barrel.r * 0.5 &&
                                barrel.y + barrel.r >= obs.y &&
                                barrel.y + barrel.r <= obs.y + 24 &&
                                barrel.vy >= 0
                            ) {
                                barrel.y = obs.y - barrel.r;
                                barrel.vy = 0;
                            }
                            if (
                                barrel.y > obs.y &&
                                barrel.y < obs.y + obs.h &&
                                barrel.x + barrel.r > obs.x &&
                                barrel.x - barrel.r < obs.x + obs.w
                            ) {
                                barrel.vx = -barrel.vx;
                                barrel.x += barrel.vx * 2;
                            }
                        } else if (obs.type === 'poly') {
                            const p1 = obs.points[0];
                            const p2 = obs.points[1];
                            const minX = Math.min(p1.x, p2.x);
                            const maxX = Math.max(p1.x, p2.x);
                            if (barrel.x >= minX && barrel.x <= maxX) {
                                const t = (barrel.x - p1.x) / ((p2.x - p1.x) || 1);
                                const surfY = p1.y + t * (p2.y - p1.y);
                                if (barrel.y + barrel.r >= surfY - 6 && barrel.y - barrel.r <= surfY + 24) {
                                    barrel.y = surfY - barrel.r;
                                    barrel.vy = 0;
                                    const slopeDir = p2.y > p1.y ? 1 : -1;
                                    barrel.vx += slopeDir * 0.35;
                                }
                            }
                        }
                    });

                    // Rolling steel barrel detonates TNT barrels on contact!
                    barrels.forEach(other => {
                        if (other !== barrel && other.active && other.kind === 'explosive') {
                            if (Math.hypot(barrel.x - other.x, barrel.y - other.y) <= barrel.r + other.r) {
                                other.active = false;
                                triggerExplosion(other.x, other.y, 165);
                            }
                        }
                    });

                    zombies.forEach(z => {
                        if (!z.alive) return;
                        const d = Math.hypot(barrel.x - z.x, barrel.y - (z.y - z.h / 2));
                        if (d < barrel.r + 26) {
                            sfx.playZombieHit(3);
                            eliminateZombie(z, 2000, 'CRUSHED! +2000', barrel.vx * 1.1, -9);
                        }
                    });
                }
            });

            // 3. Update Ragdoll Zombies & Idle Animation
            zombies.forEach(z => {
                z.bobPhase += 0.08;
                if (z.ragdoll) {
                    z.x += z.vx;
                    z.y += z.vy;
                    z.vy += 0.55;
                    z.rot += z.vRot;
                }
            });

            // 4. Update Particles & Popups
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.18;
                p.life--;
                p.alpha = Math.max(0, p.life / 30);
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy;
                ft.life--;
                ft.alpha = Math.min(1, ft.life / 20);
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            // 5. Win / Loss Check
            if (gameState === 'PLAYING') {
                const aliveCount = zombies.filter(z => z.alive).length;
                const anyRollingBarrel = barrels.some(b => b.active && b.rolling && Math.abs(b.vx) > 0.5);

                if (aliveCount === 0 && bullets.length === 0) {
                    triggerWinState();
                } else if (ammo === 0 && bullets.length === 0 && !anyRollingBarrel && aliveCount > 0) {
                    if (!window._lossTimer) {
                        window._lossTimer = setTimeout(() => {
                            const stillAlive = zombies.filter(z => z.alive).length;
                            if (gameState === 'PLAYING' && stillAlive > 0 && bullets.length === 0) {
                                triggerLossState();
                            }
                            window._lossTimer = null;
                        }, 900);
                    }
                }
            }
        }

        // ============================================================================
        // WIN / LOSS / 50-LEVEL SELECT MODAL
        // ============================================================================
        function triggerWinState() {
            gameState = 'WON';
            sfx.playWin();

            const lvl = LEVELS[currentLevelIdx];
            const ammoBonus = ammo * 1000;
            const stars = ammo >= 2 ? 3 : (ammo === 1 ? 2 : 1);
            levelProgress[lvl.id] = Math.max(levelProgress[lvl.id] || 0, stars);
            score += levelScore + ammoBonus;

            updateHUD();

            setTimeout(() => {
                showModal('WON', {
                    title: 'STAGE CLEAR!',
                    subtitle: `Level ${lvl.id}/50: ${lvl.name} conquered!`,
                    levelScore,
                    ammoBonus,
                    stars
                });
            }, 550);
        }

        function triggerLossState() {
            gameState = 'LOST';
            showModal('LOST', {
                title: 'OUT OF SHELLS!',
                subtitle: 'Tip: Click the 💡 Hint button in the top bar to see the trick-shot angle!',
                levelScore,
                ammoBonus: 0,
                stars: 0
            });
        }

        function renderLevelSelectPage(pageIdx) {
            currentSelectPage = pageIdx;
            const levelGrid = document.getElementById('modal-level-grid');
            levelGrid.innerHTML = '';

            document.querySelectorAll('.chapter-tab').forEach((tab, idx) => {
                if (idx === pageIdx) {
                    tab.classList.add('bg-lime-400');
                } else {
                    tab.classList.remove('bg-lime-400');
                }
            });

            const start = pageIdx * 10;
            const end = Math.min(start + 10, LEVELS.length);
            for (let idx = start; idx < end; idx++) {
                const lvl = LEVELS[idx];
                const st = levelProgress[lvl.id] || 0;
                const btn = document.createElement('button');
                btn.className = `cup-pill flex-col py-2 px-1.5 ${idx === currentLevelIdx ? 'bg-lime-200 border-lime-700' : ''}`;
                btn.innerHTML = `
                    <span class="text-[11px] font-black text-slate-500">LVL ${lvl.id}</span>
                    <span class="text-xs font-black text-slate-900 truncate w-full text-center">${lvl.name.split(' ')[0]}</span>
                    <span class="text-amber-500 text-xs">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</span>
                `;
                btn.onclick = () => loadLevel(idx);
                levelGrid.appendChild(btn);
            }
        }

        function showModal(mode, data = {}) {
            const overlay = document.getElementById('modal-overlay');
            const titleEl = document.getElementById('modal-title');
            const subEl = document.getElementById('modal-subtitle');
            const statsBox = document.getElementById('modal-stats-box');
            const chapterTabs = document.getElementById('modal-chapter-tabs');
            const levelGrid = document.getElementById('modal-level-grid');
            const nextBtn = document.getElementById('modal-btn-next');

            overlay.classList.remove('hidden');

            if (mode === 'LEVEL_SELECT') {
                titleEl.textContent = 'SELECT LEVEL (1–50)';
                subEl.textContent = 'All 50 puzzle arenas are unlocked—pick any chapter below:';
                statsBox.classList.add('hidden');
                chapterTabs.classList.remove('hidden');
                levelGrid.classList.remove('hidden');
                nextBtn.classList.add('hidden');

                renderLevelSelectPage(Math.floor(currentLevelIdx / 10));
            } else {
                statsBox.classList.remove('hidden');
                chapterTabs.classList.add('hidden');
                levelGrid.classList.add('hidden');
                titleEl.textContent = data.title || 'PAUSED';
                subEl.textContent = data.subtitle || 'Take your time to plan the ultimate bank shot.';
                document.getElementById('modal-score').textContent = (data.levelScore || 0).toLocaleString();
                document.getElementById('modal-bonus').textContent = `+${(data.ammoBonus || 0).toLocaleString()}`;
                document.getElementById('modal-stars').textContent =
                    '★'.repeat(data.stars || 0) + '☆'.repeat(3 - (data.stars || 0));

                if (mode === 'WON') {
                    nextBtn.classList.remove('hidden');
                } else {
                    nextBtn.classList.add('hidden');
                }
            }
        }

        function hideModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        // ============================================================================
        // RENDER ENGINE (Cup Pong Vector Aesthetic + New Interactive Gadgets)
        // ============================================================================
        function drawArenaBackground() {
            const horizonY = 475;
            ctx.fillStyle = '#76e014';
            ctx.fillRect(0, 0, GAME_W, horizonY);

            ctx.fillStyle = '#62c30c';
            const numStripes = 14;
            const stripeW = GAME_W / numStripes;
            for (let i = 0; i < numStripes; i += 2) {
                ctx.beginPath();
                const topX = i * stripeW;
                const botX = (i - 0.5) * stripeW * 1.08;
                ctx.moveTo(topX, 0);
                ctx.lineTo(topX + stripeW, 0);
                ctx.lineTo(botX + stripeW * 1.05, horizonY);
                ctx.lineTo(botX, horizonY);
                ctx.closePath();
                ctx.fill();
            }

            ctx.fillStyle = '#8b9d3b';
            ctx.fillRect(0, horizonY - 8, GAME_W, 10);

            ctx.fillStyle = '#f5ba7c';
            ctx.fillRect(0, horizonY, GAME_W, GAME_H - horizonY);

            ctx.save();
            ctx.strokeStyle = 'rgba(17, 24, 39, 0.14)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(ARENA.left, horizonY);
            ctx.lineTo(ARENA.right, horizonY);
            ctx.stroke();
            ctx.restore();
        }

        function drawGadgets() {
            // 1. Teleport Portals (Blue Entrance & Orange Exit with spinning energy rings)
            portals.forEach(pt => {
                const drawPortalNode = (x, y, color1, color2, label) => {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(simTick * 2);

                    ctx.beginPath();
                    ctx.arc(0, 0, pt.r + 4, 0, Math.PI * 2);
                    ctx.fillStyle = color1;
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = OUTLINE_COLOR;
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, 0, pt.r - 7, 0, Math.PI * 2);
                    ctx.fillStyle = color2;
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '900 11px Fredoka, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(label, 0, 4);
                    ctx.restore();
                };
                drawPortalNode(pt.ax, pt.ay, '#0284c7', '#38bdf8', 'IN');
                drawPortalNode(pt.bx, pt.by, '#ea580c', '#fb923c', 'OUT');
            });

            // 2. Shootable Target Switches (Red -> Green when unlocked)
            switches.forEach(sw => {
                ctx.save();
                ctx.translate(sw.x, sw.y);
                ctx.beginPath();
                ctx.arc(0, 0, sw.r, 0, Math.PI * 2);
                ctx.fillStyle = sw.triggered ? '#10b981' : '#f43f5e';
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = OUTLINE_COLOR;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, sw.r - 8, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });

            // 3. Neon Pinball Bumpers
            pinballs.forEach(pb => {
                ctx.save();
                ctx.translate(pb.x, pb.y);
                const r = pb.r + (pb.pulse || 0);
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fillStyle = '#ec4899';
                ctx.fill();
                ctx.lineWidth = 4.5;
                ctx.strokeStyle = OUTLINE_COLOR;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, r - 8, 0, Math.PI * 2);
                ctx.fillStyle = '#facc15';
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            });
        }

        function drawObstacles() {
            ctx.fillStyle = '#141b2d';
            ctx.fillRect(0, 0, GAME_W, ARENA.top);
            ctx.fillRect(0, ARENA.bottom, GAME_W, GAME_H - ARENA.bottom);
            ctx.fillRect(0, ARENA.top, ARENA.left, ARENA.bottom - ARENA.top);
            ctx.fillRect(ARENA.right, ARENA.top, GAME_W - ARENA.right, ARENA.bottom - ARENA.top);

            ctx.strokeStyle = OUTLINE_COLOR;
            ctx.lineWidth = 6;
            ctx.strokeRect(ARENA.left, ARENA.top, ARENA.right - ARENA.left, ARENA.bottom - ARENA.top);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.strokeRect(ARENA.left - 8, ARENA.top - 8, (ARENA.right - ARENA.left) + 16, (ARENA.bottom - ARENA.top) + 16);

            obstacles.forEach(obs => {
                if (obs.open) return;

                ctx.save();
                ctx.lineWidth = 5;
                ctx.strokeStyle = OUTLINE_COLOR;
                ctx.lineJoin = 'round';

                if (obs.type === 'rect') {
                    ctx.fillStyle = 'rgba(17, 24, 39, 0.22)';
                    ctx.fillRect(obs.x + 4, obs.y + 6, obs.w, obs.h);

                    if (obs.style === 'bumper') {
                        ctx.fillStyle = '#facc15';
                        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

                        ctx.save();
                        ctx.beginPath();
                        ctx.rect(obs.x, obs.y, obs.w, obs.h);
                        ctx.clip();
                        ctx.strokeStyle = OUTLINE_COLOR;
                        ctx.lineWidth = 8;
                        for (let s = -obs.h; s < obs.w + obs.h; s += 20) {
                            ctx.beginPath();
                            ctx.moveTo(obs.x + s, obs.y);
                            ctx.lineTo(obs.x + s - 18, obs.y + obs.h);
                            ctx.stroke();
                        }
                        ctx.restore();
                    } else {
                        ctx.fillStyle = '#151d30';
                        ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(obs.x + 4, obs.y + 4, obs.w - 8, 5);
                    }

                    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
                } else if (obs.type === 'gate') {
                    // Glowing Red Security Laser Gate
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.fillStyle = '#fecaca';
                    ctx.fillRect(obs.x + 6, obs.y + 6, obs.w - 12, obs.h - 12);
                } else if (obs.type === 'spinner') {
                    // Rotating Windmill Deflector
                    const arms = obs.arms || 2;
                    for (let a = 0; a < arms; a++) {
                        ctx.save();
                        ctx.translate(obs.cx, obs.cy);
                        ctx.rotate((obs.angle || 0) + (a * Math.PI) / arms);
                        ctx.fillStyle = '#facc15';
                        ctx.fillRect(-obs.len / 2, -(obs.thick || 18) / 2, obs.len, obs.thick || 18);
                        ctx.strokeRect(-obs.len / 2, -(obs.thick || 18) / 2, obs.len, obs.thick || 18);
                        ctx.restore();
                    }
                    ctx.beginPath();
                    ctx.arc(obs.cx, obs.cy, 14, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.stroke();
                } else if (obs.type === 'crate') {
                    ctx.fillStyle = 'rgba(17, 24, 39, 0.22)';
                    ctx.fillRect(obs.x + 4, obs.y + 6, obs.w, obs.h);

                    ctx.fillStyle = '#d97706';
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

                    ctx.strokeRect(obs.x, obs.y, obs.w, obs.h);
                    ctx.fillStyle = '#f59e0b';
                    ctx.fillRect(obs.x + 7, obs.y + 7, obs.w - 14, obs.h - 14);
                    ctx.strokeRect(obs.x + 7, obs.y + 7, obs.w - 14, obs.h - 14);

                    ctx.beginPath();
                    ctx.moveTo(obs.x + 7, obs.y + 7);
                    ctx.lineTo(obs.x + obs.w - 7, obs.y + obs.h - 7);
                    ctx.stroke();
                } else if (obs.type === 'poly') {
                    ctx.beginPath();
                    obs.points.forEach((p, idx) => {
                        if (idx === 0) ctx.moveTo(p.x, p.y);
                        else ctx.lineTo(p.x, p.y);
                    });
                    ctx.closePath();
                    ctx.fillStyle = '#151d30';
                    ctx.fill();
                    ctx.stroke();

                    if (obs.points.length >= 2) {
                        ctx.beginPath();
                        ctx.moveTo(obs.points[0].x, obs.points[0].y);
                        ctx.lineTo(obs.points[1].x, obs.points[1].y);
                        ctx.strokeStyle = '#38bdf8';
                        ctx.lineWidth = 3.5;
                        ctx.stroke();
                    }
                }
                ctx.restore();
            });
        }

        function drawBarrels() {

                ctx.fill();
                ctx.lineWidth = 4.5;
                ctx.strokeStyle = OUTLINE_COLOR;

                ctx.arc(0, 0, b.r - 6, 0, Math.PI * 2);

                    ctx.moveTo(-b.r + 6, 0);
                    ctx.lineTo(b.r - 6, 0);
                    ctx.moveTo(0, -b.r + 6);
                    ctx.lineTo(0, b.r - 6);
                    ctx.stroke();

                ctx.restore();

        function drawAimLaserAndBullets() {
            const lvl = LEVELS[currentLevelIdx];

            // Optional Hint Trajectory Overlay when user clicks 💡 Hint
            if (showHintTimer > 0 && lvl.hintAngle !== undefined) {
                const hintPts = computePredictivePath(lvl.hintAngle);
                if (hintPts.length >= 2) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(hintPts[0].x, hintPts[0].y);
                    for (let i = 1; i < hintPts.length; i++) ctx.lineTo(hintPts[i].x, hintPts[i].y);
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 6;
                    ctx.setLineDash([10, 10]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.restore();
                }
            }

            // 1. 3-Bounce Predictive Aiming Line
            if (gameState === 'PLAYING') {
                const pts = computePredictivePath();
                if (pts.length >= 2) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(pts[0].x, pts[0].y);
                    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                    ctx.strokeStyle = 'rgba(17, 24, 39, 0.55)';
                    ctx.lineWidth = 8;
                    ctx.lineCap = 'round';
                    ctx.setLineDash([12, 14]);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(pts[0].x, pts[0].y);
                    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
                    ctx.strokeStyle = superArmed ? '#facc15' : '#ffffff';
                    ctx.lineWidth = 4;
                    ctx.setLineDash([12, 14]);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    for (let i = 1; i < pts.length; i++) {
                        ctx.beginPath();
                        ctx.arc(pts[i].x, pts[i].y, 6.5, 0, Math.PI * 2);
                        ctx.fillStyle = i === 1 ? '#facc15' : '#38bdf8';
                        ctx.fill();
                        ctx.lineWidth = 3;
                        ctx.strokeStyle = OUTLINE_COLOR;
                        ctx.stroke();
                    }
                    ctx.restore();
                }

                // Direct Touch/Pointer Crosshair Reticle at the exact (x, y) touch/mouse coordinate
                if (aimTarget.active) {
                    ctx.save();
                    ctx.translate(aimTarget.x, aimTarget.y);

                    // Outer dark ring + crisp neon reticle
                    ctx.beginPath();
                    ctx.arc(0, 0, 18, 0, Math.PI * 2);
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = OUTLINE_COLOR;
                    ctx.stroke();
                    ctx.lineWidth = 2.5;
                    ctx.strokeStyle = superArmed ? '#f43f5e' : '#facc15';
                    ctx.stroke();

                    // Crosshair ticks
                    ctx.beginPath();
                    ctx.moveTo(-24, 0); ctx.lineTo(-10, 0);
                    ctx.moveTo(10, 0); ctx.lineTo(24, 0);
                    ctx.moveTo(0, -24); ctx.lineTo(0, -10);
                    ctx.moveTo(0, 10); ctx.lineTo(0, 24);
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = OUTLINE_COLOR;
                    ctx.stroke();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();

                    // Center dot
                    ctx.beginPath();
                    ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#ef4444';
                    ctx.fill();
                    ctx.restore();
                }

                // Helpful subtitle banner at top of arena
                if (lvl.subtitle) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(17, 24, 39, 0.80)';
                    ctx.beginPath();
                    ctx.roundRect(GAME_W / 2 - 310, 56, 620, 28, 14);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '800 13px Fredoka, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(lvl.subtitle, GAME_W / 2, 75);
                    ctx.restore();
                }
            }

            // 2. Active Ricochet Bullets & Neon Trails
            bullets.forEach(b => {
                if (b.trail.length > 1) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(b.trail[0].x, b.trail[0].y);
                    for (let i = 1; i < b.trail.length; i++) {
                        ctx.lineTo(b.trail[i].x, b.trail[i].y);
                    }
                    ctx.strokeStyle = b.isSuper ? '#f43f5e' : '#fef08a';
                    ctx.lineWidth = b.isSuper ? 9 : 6;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.stroke();
                    ctx.restore();
                }

                ctx.save();
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.isSuper ? 10 : 7, 0, Math.PI * 2);
                ctx.fillStyle = b.isSuper ? '#facc15' : '#ffffff';
                ctx.fill();
                ctx.lineWidth = 3.5;
                ctx.strokeStyle = OUTLINE_COLOR;
                ctx.stroke();
                ctx.restore();
            });
        }

        function drawParticlesAndPopups() {
            // Particles with crisp dark outlines matching Cup Pong aesthetic
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = OUTLINE_COLOR;
                ctx.stroke();
                ctx.restore();
            });

            // Chunky Outlined Floating Score Popups (+1000, +2000, COMBO!)
            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = ft.alpha;
                ctx.font = `900 ${ft.size}px 'Fredoka', sans-serif`;
                ctx.textAlign = 'center';
                ctx.lineJoin = 'round';
                ctx.lineWidth = 6;
                ctx.strokeStyle = OUTLINE_COLOR;
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });
        }

        // ============================================================================
        // UNIFIED DIRECT TOUCH & POINTER AIMING (PHONE & LAPTOP)
        // Touching or moving anywhere on the canvas immediately locks the laser
        // directly onto that exact (x, y) coordinate and fires cleanly on release!
        // ============================================================================
        function updateAimFromClientPos(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            if (!rect.width || !rect.height) return;

            // Exact mapping from screen pixels to internal 1280x720 canvas coordinates
            const gx = ((clientX - rect.left) / rect.width) * GAME_W;
            const gy = ((clientY - rect.top) / rect.height) * GAME_H;

            aimTarget.x = Math.max(0, Math.min(GAME_W, gx));
            aimTarget.y = Math.max(0, Math.min(GAME_H, gy));
            aimAngle = Math.atan2(aimTarget.y - hero.gunY, aimTarget.x - hero.gunX);
        }

        canvas.addEventListener('pointerdown', e => {
            if (gameState !== 'PLAYING') return;
            e.preventDefault();
            sfx.init();
            activePointerId = e.pointerId;
            aimTarget.active = true;
            if (canvas.setPointerCapture) {
                try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
            }
            updateAimFromClientPos(e.clientX, e.clientY);
        }, { passive: false });

        canvas.addEventListener('pointermove', e => {
            if (gameState !== 'PLAYING') return;
            if (e.pointerType === 'mouse' || activePointerId === e.pointerId) {
                if (e.pointerType !== 'mouse') e.preventDefault();
                aimTarget.active = true;
                updateAimFromClientPos(e.clientX, e.clientY);
            }
        }, { passive: false });

        canvas.addEventListener('pointerup', e => {
            if (activePointerId !== e.pointerId) return;
            e.preventDefault();
            updateAimFromClientPos(e.clientX, e.clientY);
            activePointerId = null;
            if (gameState === 'PLAYING') {
                fireShot();
            }
        }, { passive: false });

        canvas.addEventListener('pointercancel', e => {
            if (activePointerId === e.pointerId) {
                activePointerId = null;
                aimTarget.active = false;
            }
        });

        // Keyboard Shortcuts (Space to shoot, R to retry, H for Hint)
        window.addEventListener('keydown', e => {
            if (e.code === 'Space' && gameState === 'PLAYING') {
                e.preventDefault();
                fireShot();
            } else if (e.key === 'r' || e.key === 'R') {
                loadLevel(currentLevelIdx);
            } else if (e.key === 'h' || e.key === 'H') {
                document.getElementById('btn-hint').click();
            }
        });

        // ============================================================================
        // UI PILL BUTTON LISTENERS
        // ============================================================================
        document.getElementById('btn-restart').onclick = () => loadLevel(currentLevelIdx);
        document.getElementById('btn-skip').onclick = () => loadLevel(currentLevelIdx + 1);
        document.getElementById('btn-levels').onclick = () => showModal('LEVEL_SELECT');

        document.getElementById('btn-hint').onclick = () => {
            const lvl = LEVELS[currentLevelIdx];
            if (lvl.hintAngle !== undefined) {
                aimAngle = lvl.hintAngle;
                showHintTimer = 180;
                spawnFloatingText(hero.x + 80, hero.y - 95, '💡 OPTIMAL ANGLE LOCKED!', '#38bdf8', 22);
            }
        };

        document.querySelectorAll('.chapter-tab').forEach(tab => {
            tab.onclick = () => renderLevelSelectPage(parseInt(tab.dataset.page, 10));
        });

        document.getElementById('btn-pause').onclick = () => {
            showModal('PAUSE', {
                title: 'GAME PAUSED',
                subtitle: `Level ${LEVELS[currentLevelIdx].id}/50: ${LEVELS[currentLevelIdx].name}`,
                levelScore,
                ammoBonus: ammo * 1000,
                stars: levelProgress[LEVELS[currentLevelIdx].id] || 0
            });
        };

        document.getElementById('btn-super-shot').onclick = () => {
            if (superAmmo > 0) {
                superArmed = !superArmed;
                updateHUD();
            } else {
                spawnFloatingText(hero.x + 50, hero.y - 70, 'NO BOMBS LEFT!', '#f59e0b', 20);
            }
        };

        document.getElementById('btn-sound').onclick = () => {
            sfx.enabled = !sfx.enabled;
            document.getElementById('sound-icon').textContent = sfx.enabled ? '🔊' : '🔇';
        };

        // Modal Buttons
        document.getElementById('modal-btn-retry').onclick = () => loadLevel(currentLevelIdx);
        document.getElementById('modal-btn-levels').onclick = () => showModal('LEVEL_SELECT');
        document.getElementById('modal-btn-next').onclick = () => loadLevel(currentLevelIdx + 1);

        // Close modal if clicking outside card during Pause/Level Select
        document.getElementById('modal-overlay').addEventListener('click', e => {
            if (e.target.id === 'modal-overlay' && gameState === 'PLAYING') {
                hideModal();
            }
        });

        // ============================================================================
        // MAIN GAME LOOP
        // ============================================================================
        function gameLoop() {
            updatePhysics();

            ctx.clearRect(0, 0, GAME_W, GAME_H);
            drawArenaBackground();
            drawGadgets();
            drawObstacles();
            drawBarrels();
            drawZombies();
            drawHero();
            drawAimLaserAndBullets();
            drawParticlesAndPopups();

            requestAnimationFrame(gameLoop);
        }

        // Start Game on Window Load
        window.onload = function () {
            resizeStage();
            loadLevel(0);
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
